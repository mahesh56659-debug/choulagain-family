<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>चौंलागाँई परिवार</title><style>
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;margin:0;background:#f5f7fb;color:#17202a}
header{background:white;padding:18px;border-bottom:1px solid #ddd}main{max-width:1050px;margin:auto;padding:15px}
.card{background:white;padding:16px;margin:12px 0;border-radius:14px;border:1px solid #ddd}
input,select,button{padding:10px;margin:4px;border-radius:9px;border:1px solid #ccc;font:inherit}button{background:#1769e0;color:white;border:0}.danger{background:#d33}.secondary{background:#edf3fc;color:#17509a}.hidden{display:none}
.person{border:2px solid #1769e0;border-radius:12px;padding:10px 14px;min-width:150px;text-align:center;background:white;box-sizing:border-box}
.person.spouse{border-color:#9b59b6}.rel{font-size:12px;color:#667085;margin-top:3px}
.family{display:flex;flex-direction:column;align-items:center;margin:14px 4px;position:relative}.couple{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.heart{font-size:20px;line-height:1}
.children-box{margin-top:12px;padding:12px 10px 4px;border:1.5px dashed #aab2bd;border-radius:14px;background:#fafbfd;width:min(96%,900px);box-sizing:border-box;position:relative}
.children-box:before{content:"";position:absolute;top:-13px;left:50%;height:12px;border-left:2px solid #aab2bd}
.children-row{display:flex;justify-content:center;align-items:flex-start;gap:10px;flex-wrap:wrap}
.branch-title{font-size:14px;color:#667085;margin-bottom:8px}.row{display:flex;flex-wrap:wrap;gap:5px}.row>*{flex:1;min-width:140px}.hint{font-size:13px;color:#667085}.admin-item{padding:7px 0;border-bottom:1px solid #eee}
@media(max-width:600px){main{padding:8px}.card{padding:12px}.person{min-width:135px;max-width:45vw;padding:9px 8px}.children-box{width:100%;padding:10px 5px}.children-row{gap:5px}.couple{gap:5px}}
</style></head><body>
<header><h1>🌳 चौंलागाँई परिवार</h1><small id="status">Public Family Tree</small></header><main>
<div class="card"><div class="row"><select id="branch"></select><button class="secondary" id="refresh">↻ Refresh</button><button class="secondary" id="loginBtn">Admin Login</button><button class="danger hidden" id="logoutBtn">Logout</button></div></div>
<div class="card"><h2>परिवारको वंशवृक्ष</h2><div id="tree">लोड हुँदैछ...</div></div>
<div id="loginPanel" class="card hidden"><h2>Admin Login</h2><form id="login"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><p id="loginMsg"></p></div>
<div id="admin" class="card hidden"><h2>Admin Panel</h2>
<form id="member"><div class="row"><input id="name" placeholder="नाम" required><select id="relation" required><option value="">सम्बन्ध छान्नुहोस्</option><option>मुख्य परिवार</option><option>श्रीमान्</option><option>श्रीमती</option><option>छोरा</option><option>छोरी</option><option>बुहारी</option><option>ज्वाइँ</option><option>नाति</option><option>नातिनी</option><option>नातिनी-बुहारी</option><option>नातिनी-ज्वाइँ</option><option>परनाति</option><option>परनातिनी</option><option>अन्य</option></select></div>
<div class="row"><select id="formBranch"></select><select id="parent"></select><input id="order" type="number" min="1" placeholder="क्रम (जस्तै 1, 2, 3)"></div>
<p class="hint">श्रीमान्/श्रीमती/बुहारी/ज्वाइँका लागि “Parent/जोडिने व्यक्ति” मा उहाँको श्रीमान् वा श्रीमती छान्नुहोस्। छोरा/छोरीका लागि बाबु/आमालाई छान्नुहोस्।</p><button>सदस्य थप्नुहोस्</button></form>
<hr><h3>नयाँ शाखा</h3><form id="branchForm"><input id="newBranch" placeholder="परिवार–२" required><input id="root" placeholder="मुख्य परिवार" required><button>शाखा थप्नुहोस्</button></form><div id="list"></div></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyC1I6Qhykm_y44XzFJqwOtKwX9LNvNurp4",authDomain:"choulagain-family.firebaseapp.com",projectId:"choulagain-family",storageBucket:"choulagain-family.firebasestorage.app",messagingSenderId:"740113096734",appId:"1:740113096734:web:eba285d183197417aece0f"});
const db=firebase.firestore(),auth=firebase.auth();let B=[],M=[];
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const spouseR=new Set(["श्रीमान्","श्रीमती","बुहारी","ज्वाइँ","नातिनी-बुहारी","नातिनी-ज्वाइँ"]);
const relRank={"मुख्य परिवार":0,"श्रीमान्":1,"श्रीमती":1,"छोरा":2,"छोरी":3,"बुहारी":4,"ज्वाइँ":4,"नाति":5,"नातिनी":6,"नातिनी-बुहारी":7,"नातिनी-ज्वाइँ":7,"परनाति":8,"परनातिनी":9,"अन्य":10};
function sortMembers(a,b){let ao=Number(a.order)||999999,bo=Number(b.order)||999999;if(ao!==bo)return ao-bo;let ar=relRank[a.relation]??99,br=relRank[b.relation]??99;if(ar!==br)return ar-br;return String(a.name||"").localeCompare(String(b.name||""),"ne");}
async function load(){try{let[b,m]=await Promise.all([db.collection("branches").get(),db.collection("members").get()]);B=b.docs.map(x=>({id:x.id,...x.data()}));M=m.docs.map(x=>({id:x.id,...x.data()}));B.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ne"));$("branch").innerHTML=B.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")||"<option>कुनै शाखा छैन</option>";sync();draw()}catch(e){$("tree").textContent="Firestore error: "+e.message}}
function sync(){if(!B.length)return;$("formBranch").innerHTML=B.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");let id=$("formBranch").value||$("branch").value||B[0].id;$("branch").value=id;$("formBranch").value=id;let ms=M.filter(x=>x.branch==id).sort(sortMembers);$("parent").innerHTML='<option value="root">मूल परिवार (Root)</option>'+ms.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.relation)}</option>`).join("");$("list").innerHTML=auth.currentUser?ms.map(x=>`<div class="admin-item">${esc(x.name)} — ${esc(x.relation)}${x.order?` — क्रम ${esc(x.order)}`:""} <button onclick="del('${x.id}')">हटाउनुहोस्</button></div>`).join(""):""}
function personCard(x,ms){
  let spouse=ms.filter(y=>y.parent==x.id&&spouseR.has(y.relation)).sort(sortMembers);
  let children=ms.filter(y=>y.parent==x.id&&!spouseR.has(y.relation)).sort(sortMembers);
  let base=`<div class="person"><b>${esc(x.name)}</b><div class="rel">${esc(x.relation)}</div></div>`;
  let spouseHtml=spouse.map(s=>`<span class="heart">❤️</span><div class="person spouse"><b>${esc(s.name)}</b><div class="rel">${esc(s.relation)}</div></div>`).join("");
  let childrenHtml=children.length?`<div class="children-box"><div class="children-row">${children.map(y=>renderNode(y,ms)).join("")}</div></div>`:"";
  return `<div class="family"><div class="couple">${base}${spouseHtml}</div>${childrenHtml}</div>`;
}
function renderNode(x,ms){return personCard(x,ms)}
function draw(){let id=$("branch").value,ms=M.filter(x=>x.branch==id).sort(sortMembers);let roots=ms.filter(x=>!x.parent||x.parent=="root");$("tree").innerHTML=roots.length?roots.map(x=>renderNode(x,ms)).join(""):"यो शाखामा सदस्य छैन।"}
window.del=async id=>{if(confirm("हटाउने?")){try{await db.collection("members").doc(id).delete();load()}catch(e){alert("हटाउन सकिएन: "+e.message)}}}
$("branch").onchange=()=>{sync();draw()};$("formBranch").onchange=()=>{sync();draw()};$("relation").onchange=()=>{let r=$("relation").value;if(spouseR.has(r))$("parent").options[0].text="श्रीमान्/श्रीमती छान्नुहोस्";else $("parent").options[0].text="मूल परिवार (Root)"};$("refresh").onclick=load;
$("loginBtn").onclick=()=>$("loginPanel").classList.toggle("hidden");$("logoutBtn").onclick=()=>auth.signOut();
async function doLogin(){const msg=$("loginMsg");msg.textContent="Login हुँदैछ...";try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);msg.textContent="Login सफल भयो ✅"}catch(x){console.error(x);msg.textContent="Login error: "+(x.code||"")+" "+(x.message||x)}}
$("login").onsubmit=e=>{e.preventDefault();doLogin()};
$("member").onsubmit=async e=>{e.preventDefault();let relation=$("relation").value,parent=$("parent").value;if(spouseR.has(relation)&&parent==="root"){alert("यस सम्बन्धका लागि श्रीमान्/श्रीमती/सम्बन्धित व्यक्ति छान्नुहोस्।");return}try{let data={name:$("name").value.trim(),relation,branch:$("formBranch").value,parent};let ord=Number($("order").value);if(ord)data.order=ord;else data.order=999999;await db.collection("members").add(data);e.target.reset();$("relation").value="";load()}catch(err){alert("सदस्य थप्न सकिएन: "+err.message)}};
$("branchForm").onsubmit=async e=>{e.preventDefault();try{await db.collection("branches").add({name:$("newBranch").value.trim(),root:$("root").value.trim()});e.target.reset();load()}catch(err){alert("शाखा थप्न सकिएन: "+err.message)}};
auth.onAuthStateChanged(u=>{$("admin").classList.toggle("hidden",!u);$("loginBtn").classList.toggle("hidden",!!u);$("logoutBtn").classList.toggle("hidden",!u);$("status").textContent=u?"Admin logged in":"Public Family Tree";sync()});load();
</script></body></html>

<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>चौंलागाँई परिवार</title><style>
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;margin:0;background:#f5f7fb;color:#17202a}header{background:white;padding:18px;border-bottom:1px solid #ddd}main{max-width:900px;margin:auto;padding:15px}.card{background:white;padding:16px;margin:12px 0;border-radius:14px;border:1px solid #ddd}input,select,button{padding:10px;margin:4px;border-radius:9px;border:1px solid #ccc;font:inherit}button{background:#1769e0;color:white;border:0}.danger{background:#d33}.secondary{background:#edf3fc;color:#17509a}.hidden{display:none}.person{border:2px solid #1769e0;border-radius:12px;padding:10px 14px;margin:8px;text-align:center;display:inline-block;background:white}.rel{font-size:12px;color:#667085}.children{border-top:1px dashed #aaa}.row{display:flex;flex-wrap:wrap;gap:5px}.row>*{flex:1;min-width:140px}</style></head><body>
<header><h1>🌳 चौंलागाँई परिवार</h1><small id="status">Public Family Tree</small></header><main>
<div class="card"><div class="row"><select id="branch"></select><button class="secondary" id="refresh">↻ Refresh</button><button class="secondary" id="loginBtn">Admin Login</button><button class="danger hidden" id="logoutBtn">Logout</button></div></div>
<div class="card"><h2>परिवारको वंशवृक्ष</h2><div id="tree">लोड हुँदैछ...</div></div>
<div id="loginPanel" class="card hidden"><h2>Admin Login</h2><form id="login"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><p id="loginMsg"></p></div>
<div id="admin" class="card hidden"><h2>Admin Panel</h2><form id="member"><div class="row"><input id="name" placeholder="नाम" required><input id="relation" placeholder="सम्बन्ध" required></div><div class="row"><select id="formBranch"></select><select id="parent"></select></div><button>सदस्य थप्नुहोस्</button></form><hr><h3>नयाँ शाखा</h3><form id="branchForm"><input id="newBranch" placeholder="परिवार-२" required><input id="root" placeholder="मुख्य परिवार" required><button>शाखा थप्नुहोस्</button></form><div id="list"></div></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyC1I6Qhykm_y44XzFJqwOtKwX9LNvNurp4",authDomain:"choulagain-family.firebaseapp.com",projectId:"choulagain-family",storageBucket:"choulagain-family.firebasestorage.app",messagingSenderId:"740113096734",appId:"1:740113096734:web:eba285d183197417aece0f"});
const db=firebase.firestore(),auth=firebase.auth();let B=[],M=[];
const $=x=>document.getElementById(x), esc=x=>String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){try{let[b,m]=await Promise.all([db.collection("branches").get(),db.collection("members").get()]);B=b.docs.map(x=>({id:x.id,...x.data()}));M=m.docs.map(x=>({id:x.id,...x.data()}));$("branch").innerHTML=B.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")||"<option>कुनै शाखा छैन</option>";sync();draw()}catch(e){$("tree").textContent="Firestore Rules/Database error: "+e.message}}
function sync(){if(!B.length)return;$("formBranch").innerHTML=B.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");let id=$("formBranch").value||B[0].id;$("branch").value=id;$("formBranch").value=id;let ms=M.filter(x=>x.branch==id);$("parent").innerHTML='<option value="root">मूल परिवार</option>'+ms.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");$("list").innerHTML=auth.currentUser?ms.map(x=>`<p>${esc(x.name)} — ${esc(x.relation)} <button onclick="del('${x.id}')">हटाउनुहोस्</button></p>`).join(""):""}
function draw(){let id=$("branch").value,ms=M.filter(x=>x.branch==id);function n(x){let k=ms.filter(y=>y.parent==x.id);return `<div class="person"><b>${esc(x.name)}</b><div class="rel">${esc(x.relation)}</div>${k.length?`<div class="children">${k.map(n).join("")}</div>`:""}</div>`}let r=ms.filter(x=>!x.parent||x.parent=="root");$("tree").innerHTML=r.length?r.map(n).join(""):"यो शाखामा सदस्य छैन।"}
window.del=async id=>{if(confirm("हटाउने?")){await db.collection("members").doc(id).delete();load()}}
$("branch").onchange=()=>{sync();draw()};$("formBranch").onchange=sync;$("refresh").onclick=load;
$("loginBtn").onclick=()=>$("loginPanel").classList.toggle("hidden");$("logoutBtn").onclick=()=>auth.signOut();
$("login").onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword($("email").value,$("password").value);$("loginMsg").textContent="Login सफल भयो"}catch(x){$("loginMsg").textContent=x.message}};
$("member").onsubmit=async e=>{e.preventDefault();await db.collection("members").add({name:$("name").value.trim(),relation:$("relation").value.trim(),branch:$("formBranch").value,parent:$("parent").value});e.target.reset();load()};
$("branchForm").onsubmit=async e=>{e.preventDefault();await db.collection("branches").add({name:$("newBranch").value.trim(),root:$("root").value.trim()});e.target.reset();load()};
auth.onAuthStateChanged(u=>{$("admin").classList.toggle("hidden",!u);$("loginBtn").classList.toggle("hidden",!!u);$("logoutBtn").classList.toggle("hidden",!u);$("status").textContent=u?"Admin logged in":"Public Family Tree";sync()});load();
</script></body></html>
